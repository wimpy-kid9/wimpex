name: Run scheduled tasks

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scheduled-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Publish scheduled posts
        env:
          SITE_URL: ${{ secrets.WIMPEX_SITE_URL }}
          CRON_SECRET: ${{ secrets.WIMPEX_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/publish-scheduled"

      - name: Send scheduled messages
        env:
          SITE_URL: ${{ secrets.WIMPEX_SITE_URL }}
          CRON_SECRET: ${{ secrets.WIMPEX_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${SITE_URL%/}/api/cron/send-scheduled-messages"
